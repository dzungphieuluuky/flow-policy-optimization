[project]
name = "myfpo"
version = "0.1.0"
description = "Flow-matching policy optimization (FPO++) with open-loop action chunking, on LeRobot and PyTorch"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "av<15.0.0",  # lerobot imports av.option at module scope (gone in av
    # 17.1.0); 14.3+ is sdist-only, so the cap keeps a manylinux wheel
    "datasets>=5.0.1",
    "diffusers",
    "draccus>=0.11.6",
    "einops>=0.7.0",
    "einx>=0.4.3",
    "flax>=0.10.6",
    "gymnasium>=1.3.0",
    "gymnasium-robotics>=1.4.2",
    "huggingface-hub>=1.32.0",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "jax[cuda13]>=0.5.3",
    "jaxlib>=0.5.3",
    "lerobot>=0.6.1",
    "moviepy>=1.0.3",
    "mujoco>=3.13.0",
    "mujoco-warp>=3.14.0",
    "numpy>=1.26.4",
    "opencv-python-headless>=4.11.0.86",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.11.24",
    "pandas>=2.3.3",
    "pettingzoo>=1.27.0",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "pytest-xdist>=3.8.0",
    "safetensors>=0.8.0",
    "scikit-image>=0.22.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "tensorboard>=2.20.0",
    "torch>=2.2.2",
    "torchaudio>=2.11.0",
    "torchcodec>=0.16.0",
    "torchvision>=0.17.2",
    "wandb",
]

# The gates: pytest for behaviour, ruff for dead code. Both must be declared
# or `uv sync` prunes them and the checks stop working.
[dependency-groups]
dev = ["pytest", "ruff>=0.16"]

# The suite runs in ONE process by default. Each xdist worker takes a thread
# pool, so a distributed run forks several process trees that contend for the
# same cores, the same MUJOCO_LOG.TXT, and the same global torch RNG. Serial is
# also what makes a failure trace readable and reproducible. Override with
# `-n 4` only when you want raw throughput and are not diagnosing.
[tool.pytest.ini_options]
addopts = "-n 0"

[tool.ruff]
line-length = 100
target-version = "py312"
# The notebook pair is managed by jupytext: edit the .md, then
# `jupytext --sync`. Ruff would lint the generated .ipynb and flag the
# teaching-style code in it, so the notebooks stay out of the gate.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# F: pyflakes (unused imports/variables, redefinitions)
# ARG: unused function arguments
# RUF: ruff-specific (unused unpacked values, stale noqa)
# SIM: simplifications (collapsible ifs, suppressible exceptions)
# RET: return simplifications
# B: bugbear (unused loop variables, zip without strict)
# PTH: pathlib (open() and os.path calls go through Path)
# PLW: pylint warnings (global statements, redefined loop names)
# BLE: blind excepts. The three that remain say why in a noqa.
# TRY300: a `return` at the end of a `try` belongs in its `else`.
select = [
    "F", "E4", "E7", "E9", "ARG", "RUF", "SIM", "RET", "B", "PTH", "PLW", "BLE",
    "TRY300",
]
# E501 is not enforced: the file style is long lines, and a separate formatter
# owns line width.
# B905: `zip()` is used on equal-length pairs on purpose.
# RUF012: the mutable class attributes are config tables, not state.
# Deliberately not enabled: PLR2004 (dimension literals are idiomatic here),
# C4 (`dict(...)` reads better than a literal for config-shaped mappings),
# N (`import torch.nn.functional as F` is the ecosystem convention), and
# COM/Q (trailing commas and quote style belong to a formatter).
ignore = ["E501", "B905", "RUF012"]

[tool.ruff.lint.flake8-unused-arguments]
# Fakes that match a called signature (`*args, **kwargs`) keep their parameter
# names on purpose.
ignore-variadic-names = true

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
