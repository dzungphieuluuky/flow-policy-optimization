[project]
name = "spectral-joint-policy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dzungphieuluuky", email = "dungngocpham171@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "av>=18.1.0",
    "datasets>=1.1.1",
    "diffusers>=0.26.3",
    "draccus>=0.11.6",
    "einops>=0.7.0",
    "einx>=0.4.3",
    "flax>=0.10.0",
    "gymnasium>=1.3.0",
    "gymnasium-robotics>=1.4.2",
    "huggingface-hub>=0.36.2",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "jax>=0.5.3",
    "jaxlib>=0.5.3",
    "lerobot[core-scripts,dataset,training]>=0.1.0",
    "moviepy>=1.0.3",
    "mujoco>=3.13.0",
    "numpy>=1.26.4",
    "opencv-python-headless>=4.11.0.86",
    "optax>=0.2.0",
    "orbax-checkpoint>=0.11.0",
    "pandas>=2.3.3",
    "pettingzoo>=1.27.0",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "safetensors>=0.8.0",
    "scikit-image>=0.22.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "tensorboard>=2.20.0",
    "torch>=2.2.2",
    "torchaudio>=2.11.0",
    "torchcodec>=0.16.0",
    "torchvision>=0.17.2",
    "wandb>=0.16.6",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
spectral-joint-policy = "spectral_joint_policy:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
