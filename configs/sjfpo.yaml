# SJFPO configuration. Keep values aligned with SJFPOConfig.
# Runtime overrides may come from CLI flags; this file is the experiment YAML source.

# -- Observation / action geometry -------------------------------------
n_obs_steps: 16
action_horizon: 16
n_action_steps: 16
action_perturb_std: 0.02
hidden_dim: 128

# -- Monte-Carlo / rollout ---------------------------------------------
num_mc_samples: 16
num_euler_steps: 16
num_inference_steps: 16
chunks_per_update: 256
num_learning_epochs: 4
batch_size: 128  # chunks per minibatch; num_mini_batches = chunks_per_update / batch_size
num_envs: 64

# -- Optimization ------------------------------------------------------
gamma: 0.99
gae_lambda: 0.95
clip_param: 0.05
use_dct_transform: false
trust_region_mode: aspo
cfm_loss_reduction: mean
ema_decay: 0.95
ema_warmup_steps: 500
use_per_freq_clipping: false
clip_param_lowfreq: 0.02
clip_param_highfreq: 0.10
cfm_clamp: 20.0
log_ratio_cap: 10.0
normalize_advantage: true
use_clipped_value_loss: false
min_timestep: 0.005
max_timestep: 0.995
timestep_sampling_mode: fpo_beta
noise_sampling_mode: normal
timestep_inverse_cdf_beta: 1.0
timestep_beta_alpha: 2.0
timestep_beta_beta: 2.0

# -- DiT backbone ------------------------------------------------------
dit_depth: 2
dit_heads: 4
dit_mlp_ratio: 4.0
time_embed_dim: 128
timestep_scale: 1000.0

# -- Losses / optimization --------------------------------------------
value_loss_coef: 1.0
max_grad_norm: 0.5
num_kept_tokens: 16
policy_lr: 3.0e-4
critic_lr: 9.0e-4
optimizer_weight_decay: 1.0e-2
grad_accum_steps: 1
  num_critics: 2
