# SJFPO configuration. Values mirror SJFPOConfig defaults.
# Nothing reads this file at runtime: configs are built from the dataclass and
# overridden by CLI flags. Regenerate from the dataclass rather than hand-edit.

# -- Observation / action geometry -----------------------------
n_obs_steps: 16
use_peft: false
push_to_hub: true
repo_id: null
private: null
tags: null
license: null
report_to: all  # none keeps wandb offline
action_horizon: 16
n_action_steps: 16
action_perturb_std: 0.02
hidden_dim: 128

# -- Monte-Carlo / rollout -------------------------------------
device: null
num_mc_samples: 16
num_euler_steps: 16
num_inference_steps: 16
chunks_per_update: 256
num_learning_epochs: 2
batch_size: 128  # chunks per minibatch; num_mini_batches = chunks_per_update / batch_size
num_envs: 64

# -- Optimisation ----------------------------------------------
use_amp: false
gamma: 0.99
gae_lambda: 0.95
clip_param: 0.05
use_dct_transform: false
trust_region_mode: aspo
cfm_loss_reduction: mean
cfm_clamp: 200.0
cfm_mask_unexecuted: true
cfm_loss_clamp_negative_advantages: true
cfm_loss_clamp_negative_advantages_max: 200.0
log_ratio_cap: 10.0
normalize_advantage: true
use_clipped_value_loss: true
min_timestep: 0.005
max_timestep: 0.995
timestep_sampling_mode: fpo_beta
noise_sampling_mode: normal
noise_scaling_mode: white  # white matches the faked-diffusion noise parameterisation
timestep_inverse_cdf_beta: 1.0
timestep_beta_alpha: 2.0
timestep_beta_beta: 2.0
ema_decay: 0.95
ema_warmup_steps: 500

# -- DiT backbone ----------------------------------------------
dit_depth: 2
dit_heads: 4
dit_mlp_ratio: 4.0
time_embed_dim: 128
timestep_scale: 10000.0  # scales raw flow time into the network input range
critic_ema_decay: 0.05
use_target_critic: true

# -- Losses / optimisation -------------------------------------
num_critics: 2
value_loss_coef: 1.0
value_huber_delta: 1.0  # multiple of the batch return RMS, so the quadratic-to-linear transition tracks the target scale
max_grad_norm: 1.0  # rsl-rl default; 200.0 never bound a joint norm of up to 400
critic_max_grad_norm: 1.0  # null disables critic clipping
num_kept_tokens: 16
policy_lr: 0.001
critic_lr: 0.001
optimizer_weight_decay: 0.0001
grad_accum_steps: 1

# -- Regression detector / eval --------------------------------
log_drift_diagnostics: true
eval_max_episodes: 50
stop_return_frac: 0.7
stop_patience: 5
lr_decay: 0.5
max_lr_decays: 3

