# SJFPO defaults — mirrors src/sjfpo/configuration_sjfpo.py:SJFPOConfig.
# fp32-only (never autocast/half/bfloat16, no torch.compile).
num_mc_samples: 16
euler_train: 8
euler_eval: 16
chunks_per_update: 128
num_epochs: 10
optimizer_lr: 0.0003
optimizer_weight_decay: 0.0001
gamma: 0.999
gae_lambda: 0.995
clip_range: 0.05
clip_range_vf: 10.0
cfm_clamp: 20.0
log_ratio_cap: 10.0
tau_range: [0.005, 0.995]
dit_depth: 4
dit_heads: 4
dit_mlp_ratio: 4.0
dit_time_dim: 128
vf_coef: 0.01
grad_clip_norm: 1.0
n_obs_steps: 16
horizon: 16
executed_vs_predicted_ratio: 0.5
top_p_spectral_tokens: 1.0
hidden_dim: 128
