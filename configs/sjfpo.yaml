# SJFPO configuration. Keep values aligned with SJFPOConfig.
# Runtime overrides may come from CLI flags; this file is the experiment YAML source.

# -- Observation / action geometry -------------------------------------
n_obs_steps: 16
action_horizon: 16
n_action_steps: 16
hidden_dim: 128

# -- Monte-Carlo / rollout ---------------------------------------------
num_mc_samples: 16
num_euler_steps: 16
num_inference_steps: 16
chunks_per_update: 256
num_epochs: 4
num_minibatches: 4
num_envs: 64

# -- Optimization ------------------------------------------------------
gamma: 0.999
gae_lambda: 0.995
epsilon_clip: 0.05
use_dct_transform: false
trust_region_mode: aspo
cfm_loss_reduction: sqrt
use_per_bin_clip: false
epsilon_clip_lowfreq: 0.02
epsilon_clip_highfreq: 0.10
cfm_clamp: 20.0
log_ratio_cap: 10.0
advantage_clamp: 100.0
use_clipped_value_loss: false
min_timestep: 0.005
max_timestep: 0.995
timestep_sampling_mode: fpo_beta
noise_sampling_mode: normal
timestep_inverse_cdf_beta: 1.0
timestep_beta_alpha: 2.0
timestep_beta_beta: 2.0

# -- DiT backbone ------------------------------------------------------
dit_depth: 4
dit_heads: 4
dit_mlp_ratio: 4.0
time_embed_dim: 128
timestep_scale: 1000.0

# -- Losses / optimization --------------------------------------------
vf_coef: 1.0
grad_clip_norm: 0.5
top_p_spectral_tokens: 1.0
policy_lr: 3.0e-4
critic_lr: 9.0e-4
optimizer_weight_decay: 1.0e-2
use_gradient_checkpointing: false
grad_accum_steps: 1
