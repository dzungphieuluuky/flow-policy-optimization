# SJFPO defaults — mirrors src/sjfpo/configuration_sjfpo.py:SJFPOConfig.
# fp32 storage (bf16 autocast matmuls on CUDA; torch.compile on, SJFPO_COMPILE=0 off).
num_mc_samples: 16
num_euler_steps: 8
num_inference_steps: 16
chunks_per_update: 128
num_epochs: 10
optimizer_lr: 0.0003
optimizer_weight_decay: 0.0001
gamma: 0.999
gae_lambda: 0.995
epsilon_low: 0.2
epsilon_high: 0.28
cfm_clamp: 20.0
log_ratio_cap: 10.0
min_timestep: 0.005
max_timestep: 0.995
dit_depth: 4
dit_heads: 4
dit_mlp_ratio: 4.0
dit_time_dim: 128
timestep_scale: 1000.0
vf_coef: 0.01
kl_coef: 0.01
ema_decay: 0.999
grad_clip_norm: 1.0
n_obs_steps: 16
action_horizon: 16
executed_vs_predicted_ratio: 0.5
top_p_spectral_tokens: 1.0
hidden_dim: 128
