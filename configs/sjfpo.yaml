# SJFPO (FPO++ flow-matching) defaults — mirrors src/sjfpo/config.py:SJFPOConfig (frozen).
# fp32-only (never autocast/half/bfloat16, no torch.compile).
num_mc_samples: 16
euler_train: 16
euler_eval: 16
chunks_per_update: 128
lr: 0.0001
wd: 0.0001
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.05
clip_range_vf: 0.05
cfm_clamp: 20.0
log_ratio_cap: 10.0
tau_range: [0.005, 0.995]
dit_depth: 8
dit_heads: 4
dit_mlp_ratio: 4.0
dit_time_dim: 256
vf_coef: 1.0
grad_clip: 1.0
n_obs_steps: 16
chunk_size: 16
executed_vs_predicted_ratio: 0.5
top_p_spectral_tokens: 0.3
hidden_size: 128
