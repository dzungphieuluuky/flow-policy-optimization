# FPO++ (arXiv 2602.02481): FPO plus the per-sample ratio (Eq 10) and ASPO
# (Eq 12). DCT off, like FPO. Eq 10 is one ratio per (tau, eps) pair, which is
# ratio_granularity per_action.
#
# Shares every value and deviation listed in configs/baselines/fpo.yaml; it
# differs from that file only in trust_region_mode and ratio_granularity. The
# DCT is this repo's contribution, not FPO++'s, so the DCT-on half of the
# comparison is configs/ablations/dct_ppo.yaml.
#
#   .venv/bin/python scripts/train.py --env Hopper-v5 --config configs/baselines/fpo_pp.yaml
trust_region_mode: aspo
ratio_granularity: per_action
use_dct_transform: false
cfm_loss_reduction: sum
max_grad_norm: 48.0
num_learning_epochs: 2
policy_lr: 0.0003
num_euler_steps: 10
num_inference_steps: 10