# FPO (Flow Matching Policy Gradients, arXiv 2507.21053).
# Eq 5: PPO-clip on exp(L_CFM_old - L_CFM_new). Eq 9: mean the (tau, eps) losses,
# THEN exponentiate -- one ratio per chunk, so all its MC pairs clip together.
# DCT off: FPO flow-matches the raw action chunk.
#
# Paper values kept: lr 3e-4, 10 sampling steps, eps_clip 0.05, 16 updates per
# batch. Deliberate deviations, all on this file and its three siblings:
#   num_learning_epochs 2 -- 8 minibatches x 2 epochs already is the paper's 16
#     updates; 1 would make spo - ppo vanish on-policy.
#   num_mc_samples 16 (paper 8) -- more pairs only helps.
#   cfm_loss_reduction sum + max_grad_norm 48 -- Eq 8's loss is the squared norm
#     over the whole chunk, so eps_clip 0.05 only means what the paper says with
#     a sum. 48 = 16 steps x 3 dims restores the gradient scale the mean
#     reduction had, leaving the actor clip binding where it did before.
#   chunks_per_update counts chunks, so a rollout is 16k env steps against the
#     paper's 1024 timesteps.
#
# The advantage is QC's one-chunk backup (gae.py), not FPO's GAE: same surrogate
# and ratio, different critic, so returns are not comparable to the paper.
#
#   .venv/bin/python scripts/train.py --env Hopper-v5 --config configs/baselines/fpo.yaml
trust_region_mode: ppo
ratio_granularity: per_chunk
use_dct_transform: false
cfm_loss_reduction: sum
max_grad_norm: 48.0
num_learning_epochs: 2
policy_lr: 0.0003
num_euler_steps: 10
num_inference_steps: 10