# SPO (Eq 11) on both advantage signs, with FPO++'s per-sample ratio. Isolates the
# asymmetric trust region: differs from configs/baselines/fpo_pp.yaml only in the
# A>0 branch. Values and deviations as in configs/baselines/fpo.yaml.
#
#   .venv/bin/python scripts/train.py --env Hopper-v5 --config configs/baselines/spo.yaml
trust_region_mode: spo
ratio_granularity: per_action
use_dct_transform: false
cfm_loss_reduction: sum
max_grad_norm: 48.0
num_learning_epochs: 2
policy_lr: 0.0003
num_euler_steps: 10
num_inference_steps: 10