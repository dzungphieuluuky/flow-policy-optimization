# Shared experiment defaults — mirrors src/sjfpo/config.py RUN_MATRIX axes + budgets.
# Source of truth: config.py RunSpec/RUN_MATRIX (45 runs: 3 methods x 3 envs x 5 seeds).
# MuJoCo-only (flat Box). fp32-only. CUDA-default with CPU fallback.
run_matrix:
  methods: [sjfpo, ppo, sac]
  envs: [HalfCheetah-v5, Walker2d-v5, Hopper-v5]
  seeds: [0, 1, 2, 3, 4]
  total_steps: 1000000
  eval_steps: 50000
  ckpt_interval: 25000
tiny:
  env: Hopper-v5
  seed: 0
  steps:
    sjfpo: 20000
    ppo: 20000
    sac: 20000
  eval_steps: 10000
  ckpt_interval: 10000
eval:
  eval_steps: 50000
  ckpt_interval: 25000
  max_episodes: 12
output:
  out_dir: outputs/
# wandb: enabled by default; SJFPO_DISABLE_WANDB=1 is the only off switch (project = algo name at runtime).
# Never log secrets. See src/sjfpo/wandb_logging.py.
