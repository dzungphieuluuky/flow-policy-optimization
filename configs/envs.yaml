# State-based MuJoCo prototype ladder. `train.py --env <id>` resolves
# obs_dim/action_dim here; --obs-dim/--act-dim still override, and the live
# env space is validated against the registry at startup (mismatch = loud
# error, usually a gym version change — re-measure and update).
