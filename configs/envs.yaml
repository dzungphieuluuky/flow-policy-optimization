# State-based MuJoCo prototype ladder. `--env <id>` is all you pass: the runner
# resolves obs_dim/action_dim from here and hands them to make_policy, which
# stores them in policy.config. Never pass dims for a normal run. --obs_dim/--action_dim (underscores, draccus convention) exist only to
# override, and the live env space is validated against the registry at startup
# (mismatch = loud error, usually a gym version change — re-measure and
# update). Keep this the single source of truth: it also drives KNOWN_ENVS.
# Dims below MEASURED with gymnasium 1.x + mujoco on 2026-09-14, and
# RE-VERIFIED against the live env spaces on 2026-10-21. All eleven
# gymnasium envs matched. The three Adroit entries were not re-measured:
# they need gymnasium-robotics.
#
# Continuous-action envs only. CartPole-v1 and MountainCar-v0 were removed:
# both have Discrete action spaces, and myfpo is a continuous flow policy that
# emits float action vectors with no argmax/discrete conversion anywhere in the
# rollout. Their true action_dim (2 and 3, i.e. Discrete.n) also disagrees with
# math.prod(action_space.shape) == 1, so they tripped the startup live-space
# check and could not run at all. Re-add them only alongside discrete-action
# support, not just a dim fix.
Pendulum-v1: {obs_dim: 3, action_dim: 1, tier: smoke, requires: gymnasium}
InvertedPendulum-v5: {obs_dim: 4, action_dim: 1, tier: smoke}
InvertedDoublePendulum-v5: {obs_dim: 9, action_dim: 1, tier: smoke}
Reacher-v5: {obs_dim: 10, action_dim: 2, tier: smoke}
Hopper-v5: {obs_dim: 11, action_dim: 3, tier: core}
HalfCheetah-v5: {obs_dim: 17, action_dim: 6, tier: core}
Walker2d-v5: {obs_dim: 17, action_dim: 6, tier: core}
Swimmer-v5: {obs_dim: 8, action_dim: 2, tier: core}
Pusher-v5: {obs_dim: 23, action_dim: 7, tier: hard}
Ant-v5: {obs_dim: 105, action_dim: 8, tier: hard}
Humanoid-v5: {obs_dim: 348, action_dim: 17, tier: hard}
AdroitHandDoor-v1: {obs_dim: 39, action_dim: 28, tier: dexterous, requires: gymnasium-robotics}
AdroitHandPen-v1: {obs_dim: 45, action_dim: 24, tier: dexterous, requires: gymnasium-robotics}
AdroitHandHammer-v1: {obs_dim: 46, action_dim: 26, tier: dexterous, requires: gymnasium-robotics}
# ManiSkill 3. The MS- prefix marks the GPU-parallel path built by
# src/myfpo/maniskill_gpu.py; scripts/play.py registers the same ids against a
# single-env CPU sim. Measured on 2026-10-29 with mani_skill 3.0.1 + sapien
# 3.0.3, obs_mode="state", control_mode="pd_joint_delta_pos": the obs is the
# flat state (qpos/qvel + task extras), so the dim moves if either changes.
MS-PickCube-v1: {obs_dim: 42, action_dim: 8, tier: manipulation, requires: mani_skill}
Meta-World/reach-v3: {obs_dim: 39, action_dim: 4, tier: manipulation, requires: metaworld}
Meta-World/push-v3: {obs_dim: 39, action_dim: 4, tier: manipulation, requires: metaworld}
Meta-World/pick-place-v3: {obs_dim: 39, action_dim: 4, tier: manipulation, requires: metaworld}
Meta-World/door-open-v3: {obs_dim: 39, action_dim: 4, tier: manipulation, requires: metaworld}
